# =============================================================================
# AXUM + SVELTE 5 TEMPLATE WORKSPACE MANIFEST
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/services",
    "crates/api",
    "crates/server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Axum Svelte Template Contributors"]
license = "MIT"

[workspace.dependencies]
# Internal Crates
shared = { path = "crates/shared" }
services = { path = "crates/services" }
api = { path = "crates/api" }

# Serialization & Validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
regex = "1"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1.0.100"

# Web Server & Async Runtime
axum = { version = "0.8.0", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "compression-br", "set-header"] }

# Database (PostgreSQL + SeaORM)
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }

# HTTP Client, Security, Encoding
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5"
sha2 = "0.10.9"
md-5 = "0.10.6"
hex = "0.4.3"
base64 = "0.22.1"
cookie = "0.18.1"
rand = "0.9.2"
urlencoding = "2.1"

# Configuration
dotenvy = "0.15"
config = "0.15"

# Object Storage (Optional Cloudflare R2 / S3)
aws-sdk-s3 = "1.124.0"
aws-config = "1.8.14"

# Caching & Scheduling
moka = { version = "0.12", features = ["future"] }
tokio-cron-scheduler = "0.15.1"

# Logging & Tracing
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# AST Codegen & CLI
syn = { version = "2", features = ["full", "visit"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"

# Faster development builds for third-party crates while keeping workspace debuggable
[profile.dev.package."*"]
opt-level = 3

# Optimized release binary for Docker / VPS deployment
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
